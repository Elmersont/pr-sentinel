name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: dist/ must be committed and up to date
        run: git diff --exit-code -- dist
      - name: End-to-end (bundled action vs fake GitHub/Anthropic/Jira)
        run: npm run e2e
      - name: Eval harness sanity (oracle must score 100%)
        run: npm run eval -- --provider oracle --min-recall 1
