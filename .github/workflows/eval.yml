name: Eval (real model)

# Manual run. Uses the LLM_API_KEY repository secret and the free Gemini config.
on:
  workflow_dispatch:
    inputs:
      delay_ms:
        description: 'Pause between cases in ms (raise it if you hit free-tier rate limits)'
        default: '8000'
      only:
        description: 'Only run cases whose file name contains this text (empty = all)'
        default: ''

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run eval
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          DELAY_MS: ${{ inputs.delay_ms }}
          ONLY: ${{ inputs.only }}
        run: |
          set -o pipefail
          npm run eval -- --config examples/gemini.yml --delay-ms "$DELAY_MS" ${ONLY:+--only "$ONLY"} --out evals/results.json | tee eval.log
      - name: Job summary
        if: always()
        run: |
          { echo '## Eval results'; echo '```'; cat eval.log 2>/dev/null || echo 'no output'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            evals/results.json
            eval.log
          if-no-files-found: ignore
