# PR Sentinel configuration (this file reviews the repo itself).
# This repo reviews its own PRs with the free Gemini tier (see examples/ for other providers).
provider: openai-compatible
base_url: https://generativelanguage.googleapis.com/v1beta/openai/
model: gemini-2.5-flash
reasoning_effort: low
language: en
min_severity: low          # info | low | medium | high | critical
fail_on: none              # set to "high" to block merges on serious findings
max_findings: 15
max_diff_chars: 60000
inline_comments: false     # also post line-anchored review comments
ignore:
  - "dist/**"
  - "evals/cases/**"       # intentionally buggy fixtures
# Optional: show an estimated cost in the report (USD per million tokens, check your price list)
# pricing:
#   input_per_mtok: 3
#   output_per_mtok: 15
integrations:
  jira:
    enabled: false
    project_key: ENG
    issue_type: Task
    min_severity: high
  teams:
    enabled: false
    min_risk: high
  slack:
    enabled: false
    min_risk: high
